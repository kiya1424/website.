<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury International Phone Input | SURA Photography</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #faf9f6;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: #141414;
        }

        .component-stage {
            width: 100%;
            max-width: 480px;
            position: relative;
        }

        /* Main Pill Bar */
        .luxury-phone-bar {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 50px;
            padding: 6px 8px 6px 8px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .luxury-phone-bar:focus-within,
        .luxury-phone-bar.active {
            border-color: #141414;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        /* Country Selector Pill */
        .country-selector-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f4f3ef;
            border: none;
            padding: 10px 16px;
            border-radius: 40px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            color: #141414;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            flex-shrink: 0;
        }

        .country-selector-btn:hover {
            background: #eae8e1;
        }

        .country-flag {
            font-size: 1.15rem;
            line-height: 1;
            display: inline-block;
        }

        .country-code-text {
            letter-spacing: 0.02em;
        }

        .chevron-icon {
            font-size: 0.65rem;
            color: #8c8c85;
            transition: transform 0.25s ease;
        }

        .country-selector-btn.open .chevron-icon {
            transform: rotate(180deg);
        }

        /* Phone Text Input */
        .phone-text-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 10px 18px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: #141414;
            letter-spacing: 0.04em;
        }

        .phone-text-input::placeholder {
            color: #b5b5ad;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        /* Dropdown Panel */
        .countries-dropdown {
            position: absolute;
            top: calc(100% + 12px);
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            z-index: 100;
            max-height: 320px;
            display: flex;
            flex-direction: column;
            animation: dropdownFade 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes dropdownFade {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Search Bar inside Dropdown */
        .dropdown-search-wrap {
            padding: 14px 18px 10px;
            border-bottom: 1px solid #f2f1ec;
        }

        .dropdown-search-input {
            width: 100%;
            border: 1px solid #eae8e1;
            background: #fafaf8;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.84rem;
            outline: none;
            font-family: inherit;
        }

        .dropdown-search-input:focus {
            border-color: #141414;
            background: #ffffff;
        }

        /* Country List Items */
        .country-items-list {
            overflow-y: auto;
            padding: 8px 0;
            max-height: 240px;
        }

        .country-items-list::-webkit-scrollbar {
            width: 5px;
        }

        .country-items-list::-webkit-scrollbar-thumb {
            background: #dedcd5;
            border-radius: 10px;
        }

        .country-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.15s ease;
            font-size: 0.9rem;
        }

        .country-item:hover,
        .country-item.selected {
            background: #f8f7f3;
        }

        .country-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .country-item-name {
            font-weight: 500;
            color: #1f1f1f;
        }

        .country-item-dial {
            font-size: 0.82rem;
            font-weight: 600;
            color: #8c8c85;
            letter-spacing: 0.02em;
        }

        .country-item.selected .country-item-dial {
            color: #141414;
        }
    </style>
</head>

<body>

    <div class="component-stage">
        <!-- Single Horizontal Pill-Shaped Input -->
        <div class="luxury-phone-bar" id="phoneBar">
            <button type="button" class="country-selector-btn" id="countrySelectorBtn" aria-expanded="true">
                <span class="country-flag" id="currentFlag">🇪🇹</span>
                <span class="country-code-text" id="currentDialCode">+251</span>
                <i class="fa-solid fa-chevron-down chevron-icon"></i>
            </button>

            <input type="tel" class="phone-text-input" id="phoneInput" placeholder="94 525 5053" autocomplete="tel">
        </div>

        <!-- Refined Dropdown Menu -->
        <div class="countries-dropdown" id="countriesDropdown">
            <div class="dropdown-search-wrap">
                <input type="text" class="dropdown-search-input" id="countrySearch"
                    placeholder="Search country or code...">
            </div>

            <div class="country-items-list" id="countryList">
                <div class="country-item selected" data-code="+251" data-flag="🇪🇹" data-name="Ethiopia"
                    data-placeholder="94 525 5053">
                    <div class="country-item-left">
                        <span class="country-flag">🇪🇹</span>
                        <span class="country-item-name">Ethiopia</span>
                    </div>
                    <span class="country-item-dial">+251</span>
                </div>

                <div class="country-item" data-code="+1" data-flag="🇺🇸" data-name="United States"
                    data-placeholder="(555) 000-0000">
                    <div class="country-item-left">
                        <span class="country-flag">🇺🇸</span>
                        <span class="country-item-name">United States</span>
                    </div>
                    <span class="country-item-dial">+1</span>
                </div>

                <div class="country-item" data-code="+44" data-flag="🇬🇧" data-name="United Kingdom"
                    data-placeholder="7911 123456">
                    <div class="country-item-left">
                        <span class="country-flag">🇬🇧</span>
                        <span class="country-item-name">United Kingdom</span>
                    </div>
                    <span class="country-item-dial">+44</span>
                </div>

                <div class="country-item" data-code="+1" data-flag="🇨🇦" data-name="Canada"
                    data-placeholder="(555) 000-0000">
                    <div class="country-item-left">
                        <span class="country-flag">🇨🇦</span>
                        <span class="country-item-name">Canada</span>
                    </div>
                    <span class="country-item-dial">+1</span>
                </div>

                <div class="country-item" data-code="+49" data-flag="🇩🇪" data-name="Germany"
                    data-placeholder="1512 3456789">
                    <div class="country-item-left">
                        <span class="country-flag">🇩🇪</span>
                        <span class="country-item-name">Germany</span>
                    </div>
                    <span class="country-item-dial">+49</span>
                </div>

                <div class="country-item" data-code="+33" data-flag="🇫🇷" data-name="France"
                    data-placeholder="6 12 34 56 78">
                    <div class="country-item-left">
                        <span class="country-flag">🇫🇷</span>
                        <span class="country-item-name">France</span>
                    </div>
                    <span class="country-item-dial">+33</span>
                </div>

                <div class="country-item" data-code="+971" data-flag="🇦🇪" data-name="United Arab Emirates"
                    data-placeholder="50 123 4567">
                    <div class="country-item-left">
                        <span class="country-flag">🇦🇪</span>
                        <span class="country-item-name">UAE</span>
                    </div>
                    <span class="country-item-dial">+971</span>
                </div>

                <div class="country-item" data-code="+61" data-flag="🇦🇺" data-name="Australia"
                    data-placeholder="412 345 678">
                    <div class="country-item-left">
                        <span class="country-flag">🇦🇺</span>
                        <span class="country-item-name">Australia</span>
                    </div>
                    <span class="country-item-dial">+61</span>
                </div>

                <div class="country-item" data-code="+91" data-flag="🇮🇳" data-name="India"
                    data-placeholder="98765 43210">
                    <div class="country-item-left">
                        <span class="country-flag">🇮🇳</span>
                        <span class="country-item-name">India</span>
                    </div>
                    <span class="country-item-dial">+91</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const countrySelectorBtn = document.getElementById('countrySelectorBtn');
        const countriesDropdown = document.getElementById('countriesDropdown');
        const countryList = document.getElementById('countryList');
        const currentFlag = document.getElementById('currentFlag');
        const currentDialCode = document.getElementById('currentDialCode');
        const phoneInput = document.getElementById('phoneInput');
        const countrySearch = document.getElementById('countrySearch');
        const phoneBar = document.getElementById('phoneBar');

        // Toggle Dropdown
        countrySelectorBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = countriesDropdown.style.display !== 'none';
            if (isOpen) {
                closeDropdown();
            } else {
                openDropdown();
            }
        });

        function openDropdown() {
            countriesDropdown.style.display = 'flex';
            countrySelectorBtn.classList.add('open');
            phoneBar.classList.add('active');
            countrySearch.focus();
        }

        function closeDropdown() {
            countriesDropdown.style.display = 'none';
            countrySelectorBtn.classList.remove('open');
            phoneBar.classList.remove('active');
        }

        // Select country item
        document.querySelectorAll('.country-item').forEach(item => {
            item.addEventListener('click', () => {
                const flag = item.getAttribute('data-flag');
                const code = item.getAttribute('data-code');
                const placeholder = item.getAttribute('data-placeholder');

                currentFlag.textContent = flag;
                currentDialCode.textContent = code;
                phoneInput.placeholder = placeholder;

                document.querySelectorAll('.country-item').forEach(i => i.classList.remove('selected'));
                item.classList.add('selected');

                closeDropdown();
                phoneInput.focus();
            });
        });

        // Search filter
        countrySearch.addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            document.querySelectorAll('.country-item').forEach(item => {
                const name = item.getAttribute('data-name').toLowerCase();
                const code = item.getAttribute('data-code').toLowerCase();
                if (name.includes(q) || code.includes(q)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        });

        // Close on outside click
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.component-stage')) {
                closeDropdown();
            }
        });
    </script>
</body>

</html>
